<!DOCTYPE html><html lang="cs"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AuraX</title>
<style>
:root {
  --bg:      #1a1a1a;
  --surface: #252525;
  --border:  #333;
  --text:    #ddd;
  --muted:   #777;
  --accent:  #e07b39;
  --green:   #2d7a3a;
  --red:     #7a2d2d;
  --blue:    #2d4a7a;
}
* { box-sizing: border-box; }
body {
  font-family: sans-serif;
  max-width: 500px;
  margin: 32px auto;
  padding: 0 16px 40px;
  background: var(--bg);
  color: var(--text);
}
h1 { font-size: 1.4rem; margin: 0 0 20px; color: var(--accent); letter-spacing: .05em; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button {
  padding: 10px 20px; margin: 4px; font-size: 1rem;
  cursor: pointer; border: none; border-radius: 6px;
  transition: filter .15s;
}
button:hover  { filter: brightness(1.2); }
button:active { filter: brightness(0.85); }
.play   { background: var(--green); color: #fff; }
.stop   { background: var(--red);   color: #fff; }
.save   { background: var(--blue);  color: #fff; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  margin: 10px 0;
}
details.card > summary {
  cursor: pointer; font-weight: bold;
  list-style: none; display: flex; align-items: center; gap: 8px;
}
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::before {
  content: '▶'; font-size: .65rem; color: var(--accent);
  transition: transform .2s; flex-shrink: 0;
}
details.card[open] > summary::before { transform: rotate(90deg); }
details.card > summary ~ * { margin-top: 12px; }
input[type=text], input[type=number], input[type=password], select {
  background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 5px 8px; font-size: .95rem; width: 100%;
}
input[type=range] {
  -webkit-appearance: none; width: 100%;
  height: 4px; background: var(--border); border-radius: 2px;
  outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px;
  border-radius: 50%; background: var(--accent); cursor: pointer;
}
input[type=range]::-moz-range-thumb {
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--accent); border: none; cursor: pointer;
}
.cfg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0; }
.cfg-grid label { display: flex; flex-direction: column; font-size: .82rem; color: var(--muted); gap: 4px; }
.dz {
  border: 2px dashed var(--border); border-radius: 6px;
  padding: 16px; text-align: center; color: var(--muted);
  transition: border-color .2s;
}
.dz:hover { border-color: var(--accent); }
.dz p { margin: 0 0 10px; }
#status { font-size: .85rem; color: var(--muted); }
#status b { color: var(--text); }
#status a { color: var(--accent); }
#peers { font-size: .85rem; color: var(--muted); margin-top: 4px; padding: 0 2px; }
#peers a { color: var(--accent); }
.prog { font-size: .85rem; color: var(--muted); margin: 6px 0 0; }
</style>
</head><body>
<h1>AuraX</h1>

<div>
  <button class="play" onclick="fetch('/play').then(refresh)">&#9654; Play</button>
  <button class="stop" onclick="fetch('/stop').then(refresh)">&#9632; Stop</button>
  <button class="stop" onclick="fetch('/off').then(refresh)">&#9866; Off</button>
</div>

<div class="card" style="margin-top:14px">
  <div style="display:flex;align-items:center;gap:10px">
    <span style="font-size:.9rem;white-space:nowrap">&#9728; Jas</span>
    <input type="range" id="bri" min="0" max="100" oninput="setBri(this.value)">
    <span id="briVal" style="font-size:.9rem;min-width:72px;text-align:right">PIX soubor</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap">
    <span style="font-size:.9rem;color:var(--muted);white-space:nowrap">Sync</span>
    <button onclick="nudge(-100)" style="padding:6px 14px;font-size:.85rem">&#9664; &minus;100ms</button>
    <button onclick="nudge(100)"  style="padding:6px 14px;font-size:.85rem">+100ms &#9654;</button>
  </div>
</div>

<details class="card" id="efxPanel">
  <summary>&#10024; Efekty</summary>
  <div class="cfg-grid">
    <label>Efekt
      <select id="efxId">
        <option value="1">Solid</option>
        <option value="2">Android</option>
      </select>
    </label>
    <label>&#352;&#237;&#345;ka
      <input type="number" id="efxDot" value="3" min="1" max="20" style="width:70px">
    </label>
    <label style="grid-column:1/-1">Rychlost
      <input type="range" id="efxSpeed" value="100" min="10" max="1000">
    </label>
  </div>
  <div style="margin:8px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <span style="font-size:.85rem;color:var(--muted)">Paleta</span>
    <div id="palette" style="display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center"></div>
    <button onclick="addColor()" style="padding:3px 10px;font-size:1.1rem;line-height:1">+</button>
  </div>
  <button class="play" onclick="startEffect()">&#9654; Spustit efekt</button>
</details>

<div class="card">
  <div class="dz">
    <p>Nahr&#225;t .pix soubor</p>
    <input type="file" id="file" accept=".pix">
    <br><br>
    <button onclick="upload()">Nahr&#225;t</button>
    <p id="upProg" class="prog"></p>
  </div>
</div>

<div id="status" class="card">na&#269;&#237;t&#225;m&#8230;</div>
<div id="peers"></div>

<div class="card" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
  <span style="font-size:.85rem;color:var(--muted)">Firmware (.bin)</span>
  <input type="file" id="fw" accept=".bin" style="font-size:.8rem;max-width:180px;width:auto">
  <button class="save" onclick="updateFw()" style="padding:6px 14px;font-size:.85rem">Nahr&#225;t</button>
  <span id="fwProg" class="prog" style="margin:0"></span>
</div>

<p style="margin-top:20px;padding:0 2px">
  <a href="/experimental" style="font-size:.85rem;color:var(--muted)">&#9881; Experimental</a>
</p>

<script>
function nudge(ms) { fetch('/nudge?v=' + ms); }
function setBri(v) {
  document.getElementById('briVal').textContent = +v === 0 ? 'PIX soubor' : v + '%';
  fetch('/brightness?v=' + v);
}
function startEffect() {
  var colors=[...document.querySelectorAll('#palette input')].map(function(i){
    var h=i.value.slice(1);
    return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};
  });
  if(!colors.length) colors=[{r:255,g:0,b:0}];
  fetch('/effect',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:+document.getElementById('efxId').value,
      speed:+document.getElementById('efxSpeed').value,
      dotSize:+document.getElementById('efxDot').value,
      palette:colors})});
}
function addColor() {
  if(document.querySelectorAll('#palette input').length>=4) return;
  var inp=document.createElement('input'); inp.type='color'; inp.value='#ff0000';
  inp.style='margin:0;width:52px;height:44px;cursor:pointer;touch-action:manipulation';
  document.getElementById('palette').appendChild(inp);
}
function initPalette(rs,gs,bs,sz) {
  var p=document.getElementById('palette'); p.innerHTML='';
  for(var i=0;i<sz;i++){
    var inp=document.createElement('input'); inp.type='color';
    var r=rs[i]||0,g=gs[i]||0,b=bs[i]||0;
    inp.value='#'+('0'+r.toString(16)).slice(-2)+('0'+g.toString(16)).slice(-2)+('0'+b.toString(16)).slice(-2);
    inp.style='margin:0;width:52px;height:44px;cursor:pointer;touch-action:manipulation';
    p.appendChild(inp);
  }
}
function rssiBar(dbm) {
  if (!dbm) return '';
  var s = dbm>-55?5:dbm>-65?4:dbm>-72?3:dbm>-80?2:1;
  return ' &nbsp;|&nbsp; &#128246; '+'█'.repeat(s)+'░'.repeat(5-s)+' ('+dbm+' dBm)';
}
function refresh() {
  fetch('/status').then(r=>r.json()).then(d=>{
    document.getElementById('status').innerHTML =
      'Stav: <b>'+(d.playing?'přehrává':'zastaveno')+'</b>'
      +(d.file?' &nbsp;|&nbsp; '+d.file:'')
      +(d.commands?' &nbsp;|&nbsp; příkazy: '+d.commands:'')
      +(d.frames_expected?' &nbsp;|&nbsp; snímky: '+d.frames_rendered+'/'+d.frames_expected+(d.frames_expected>d.frames_rendered?' ⚠':''):'')
      +'<br>'+(d.ap_mode?'&#128246; AP: ':'IP: ')+'<a href="http://'+d.ip+'">'+d.ip+'</a>'
      +(d.hostname?' &nbsp;|&nbsp; '+d.hostname+'.local':'')
      +(d.ap_mode?' <span style="color:#e07b39">(Windows: použij IP odkaz)</span>':'')
      +' &nbsp;|&nbsp; &#128267; '+d.battery_pct+'% ('+d.battery_mv+' mV)'
      +(!d.ap_mode?rssiBar(d.rssi):'');
  });
  fetch('/peers').then(r=>r.json()).then(ps=>{
    document.getElementById('peers').innerHTML = ps.length
      ? '&#128279; ' + ps.map(p=>`<a href="http://${p.ip}">${p.hostname}</a> &#128267;${p.bat_pct}%${rssiBar(p.rssi)}${p.sync_channel?' &nbsp;ch'+p.sync_channel:''}`).join(' &nbsp;&middot;&nbsp; ')
      : '';
  }).catch(()=>{});
}
function upload() {
  const f = document.getElementById('file').files[0];
  if (!f) return alert('Vyber soubor');
  const p = document.getElementById('upProg');
  p.textContent = 'Nahrávám...';
  const fd = new FormData(); fd.append('file', f, f.name);
  fetch('/upload',{method:'POST',body:fd})
    .then(r=>r.text()).then(t=>{p.textContent=t;refresh();})
    .catch(()=>{p.textContent='Chyba nahrávání';});
}
function updateFw() {
  const f = document.getElementById('fw').files[0];
  if (!f) return alert('Vyber .bin soubor');
  const p = document.getElementById('fwProg');
  p.textContent = 'Nahrávám firmware...';
  const fd = new FormData(); fd.append('firmware', f, f.name);
  fetch('/update',{method:'POST',body:fd})
    .then(r=>r.text()).then(t=>{p.textContent=t;})
    .catch(()=>{p.textContent='Chyba nahrávání';});
}
fetch('/config').then(r=>r.json()).then(d=>{
  document.getElementById('bri').value = d.brightness || 0;
  setBri(d.brightness || 0);
  document.getElementById('efxId').value    = d.effectId    || 1;
  document.getElementById('efxSpeed').value = d.effectSpeed || 100;
  document.getElementById('efxDot').value   = d.effectDotSize || 3;
  initPalette(d.paletteR||[255],d.paletteG||[0],d.paletteB||[0],d.paletteSize||1);
});
setInterval(refresh, 2000);
refresh();
</script>
</body></html>
