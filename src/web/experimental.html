<!DOCTYPE html><html lang="cs"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AuraX — Experimental</title>
<style>
:root {
  --bg:      #1a1a1a;
  --surface: #252525;
  --border:  #333;
  --text:    #ddd;
  --muted:   #777;
  --accent:  #e07b39;
  --green:   #2d7a3a;
  --red:     #7a2d2d;
  --blue:    #2d4a7a;
}
* { box-sizing: border-box; }
body {
  font-family: sans-serif;
  max-width: 500px;
  margin: 32px auto;
  padding: 0 16px 40px;
  background: var(--bg);
  color: var(--text);
}
h1 { font-size: 1.4rem; margin: 0 0 20px; color: var(--accent); letter-spacing: .05em; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button {
  padding: 10px 20px; margin: 4px; font-size: 1rem;
  cursor: pointer; border: none; border-radius: 6px;
  transition: filter .15s;
}
button:hover  { filter: brightness(1.2); }
button:active { filter: brightness(0.85); }
.play   { background: var(--green); color: #fff; }
.stop   { background: var(--red);   color: #fff; }
.save   { background: var(--blue);  color: #fff; }
.reboot { background: #7a4a1a;      color: #fff; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  margin: 10px 0;
}
details.card > summary {
  cursor: pointer; font-weight: bold;
  list-style: none; display: flex; align-items: center; gap: 8px;
}
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::before {
  content: '▶'; font-size: .65rem; color: var(--accent);
  transition: transform .2s; flex-shrink: 0;
}
details.card[open] > summary::before { transform: rotate(90deg); }
details.card > summary ~ * { margin-top: 12px; }
input[type=text], input[type=number], input[type=password], select {
  background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 5px 8px; font-size: .95rem; width: 100%;
}
input[type=range] {
  -webkit-appearance: none; width: 100%;
  height: 4px; background: var(--border); border-radius: 2px;
  outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px;
  border-radius: 50%; background: var(--accent); cursor: pointer;
}
input[type=range]::-moz-range-thumb {
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--accent); border: none; cursor: pointer;
}
input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
.cfg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0; }
.cfg-grid label { display: flex; flex-direction: column; font-size: .82rem; color: var(--muted); gap: 4px; }
.cfg-grid label input, .cfg-grid label select { color: var(--text); }
.dz {
  border: 2px dashed var(--border); border-radius: 6px;
  padding: 16px; text-align: center; color: var(--muted);
  transition: border-color .2s;
}
.dz:hover { border-color: var(--accent); }
.dz p { margin: 0 0 10px; }
hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
#status { font-size: .85rem; color: var(--muted); }
#status b { color: var(--text); }
#status a { color: var(--accent); }
#peers { font-size: .85rem; color: var(--muted); margin-top: 4px; padding: 0 2px; }
#peers a { color: var(--accent); }
#cfgMsg { font-size: .85rem; color: var(--muted); margin: 8px 0 0; }
.prog { font-size: .85rem; color: var(--muted); margin: 6px 0 0; }
</style>
</head><body>
<p style="margin:0 0 16px"><a href="/" style="font-size:.85rem;color:var(--muted)">&#8592; Zpět</a></p>
<h1>AuraX <span style="font-size:.75rem;color:var(--muted);letter-spacing:.1em">EXPERIMENTAL</span></h1>

<div>
  <button class="play" onclick="fetch('/play').then(refresh)">&#9654; Play</button>
  <button class="stop" onclick="fetch('/stop').then(refresh)">&#9632; Stop</button>
  <button class="stop" onclick="fetch('/off').then(refresh)">&#9866; Off</button>
</div>

<div class="card" style="margin-top:14px">
  <div style="display:flex;align-items:center;gap:10px">
    <span style="font-size:.9rem;white-space:nowrap">&#9728; Jas</span>
    <input type="range" id="bri" min="0" max="100" oninput="setBri(this.value)">
    <span id="briVal" style="font-size:.9rem;min-width:72px;text-align:right">PIX soubor</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap">
    <span style="font-size:.9rem;color:var(--muted);white-space:nowrap">Sync</span>
    <button onclick="nudge(-100)" style="padding:6px 14px;font-size:.85rem">&#9664; &minus;100ms</button>
    <button onclick="nudge(100)"  style="padding:6px 14px;font-size:.85rem">+100ms &#9654;</button>
  </div>
</div>

<details class="card" id="efxPanel">
  <summary>&#10024; Efekty</summary>
  <div class="cfg-grid">
    <label>Efekt
      <select id="efxId">
        <option value="1">Solid</option>
        <option value="2">Android</option>
      </select>
    </label>
    <label>&#352;&#237;&#345;ka
      <input type="number" id="efxDot" value="3" min="1" max="20" style="width:70px">
    </label>
    <label style="grid-column:1/-1">Rychlost
      <input type="range" id="efxSpeed" value="100" min="10" max="1000">
    </label>
  </div>
  <div style="margin:8px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <span style="font-size:.85rem;color:var(--muted)">Paleta</span>
    <div id="palette" style="display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center"></div>
    <button onclick="addColor()" style="padding:3px 10px;font-size:1.1rem;line-height:1">+</button>
  </div>
  <button class="play" onclick="startEffect()">&#9654; Spustit efekt</button>
</details>

<div class="card">
  <div class="dz">
    <p>Nahr&#225;t .pix soubor</p>
    <input type="file" id="file" accept=".pix">
    <br><br>
    <button onclick="upload()">Nahr&#225;t</button>
    <p id="upProg" class="prog"></p>
  </div>
</div>

<div id="status" class="card">na&#269;&#237;t&#225;m&#8230;</div>
<div id="peers"></div>

<details class="card">
  <summary>&#9881; Nastavení</summary>
  <form id="cfg">
  <div class="cfg-grid">
    <label>LED typ
      <select name="ledType" onchange="updClk(this.value)">
        <option value="1">APA102</option>
        <option value="0">WS281x</option>
      </select>
    </label>
    <label>Po&#269;et LED <input type="number" name="numLeds" min="1" max="2048"></label>
    <label>Data pin <input type="number" name="dataPin" min="0" max="48"></label>
    <label id="clkLabel">CLK pin <input type="number" name="clkPin" min="0" max="48"></label>
    <label style="grid-column:1/-1">PIX soubor
      <input type="text" name="pixFile" style="width:100%">
    </label>
    <label>WiFi SSID <input type="text" name="ssid"></label>
    <label>WiFi heslo <input type="password" name="password"></label>
    <label style="grid-column:1/-1">Hostname (.local)
      <input type="text" name="hostname" pattern="[a-z0-9-]+" placeholder="aurax-xxxx" style="width:100%">
    </label>
    <label>Sync kan&#225;l
      <select name="syncChannel">
        <option value="0">Vypnuto</option>
        <option value="1">1</option><option value="2">2</option><option value="3">3</option>
        <option value="4">4</option><option value="5">5</option><option value="6">6</option>
        <option value="7">7</option><option value="8">8</option><option value="9">9</option>
        <option value="10">10</option>
      </select>
    </label>
    <label>Limit mA (0=off)
      <input type="number" id="cfgMALimit" name="mALimit" min="0" max="65000" step="100">
    </label>
  </div>

  <details style="margin:10px 0;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px">
    <summary style="cursor:pointer;font-size:.9rem;color:var(--muted)">&#128267; Baterie</summary>
    <div class="cfg-grid" style="margin-top:10px">
      <label>ADC pin <input type="number" name="batPin" min="0" max="48"></label>
      <label>Multiplier <input type="number" name="batMultiplier" min="0.1" max="20" step="0.001"></label>
      <label>Kalibrace (V) <input type="number" name="batCalibration" step="0.001"></label>
      <label>Min mV <input type="number" name="batMinMv" min="0" max="5000"></label>
      <label>Max mV <input type="number" name="batMaxMv" min="0" max="5000"></label>
      <label style="grid-column:1/-1">Interval m&#283;&#345;en&#237; (ms)
        <input type="number" name="batIntervalMs" min="100" max="3600000" step="1000" style="width:130px">
      </label>
      <label style="grid-column:1/-1;flex-direction:row;align-items:center;gap:8px;color:var(--text)">
        <input type="checkbox" name="batAutoOff">
        Auto off pod
        <input type="number" name="batAutoOffThreshold" min="0" max="100" style="width:60px">%
      </label>
    </div>
  </details>

  <div style="margin-top:4px">
    <button type="button" class="save" onclick="saveCfg()">Ulo&#382;it</button>
    <button type="button" class="reboot" onclick="reboot()">Reboot</button>
  </div>
  <p id="cfgMsg"></p>

  <hr>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <span style="font-size:.85rem;color:var(--muted)">Firmware (.bin)</span>
    <input type="file" id="fw" accept=".bin" style="font-size:.8rem;max-width:180px;width:auto">
    <button type="button" class="save" onclick="updateFw()" style="padding:6px 14px;font-size:.85rem">Nahr&#225;t</button>
    <span id="fwProg" class="prog" style="margin:0"></span>
  </div>
  </form>
</details>

<script>
function updClk(v) {
  document.getElementById('clkLabel').style.display = (parseInt(v) === 1) ? '' : 'none';
}
function nudge(ms) { fetch('/nudge?v=' + ms); }
function setBri(v) {
  document.getElementById('briVal').textContent = +v === 0 ? 'PIX soubor' : v + '%';
  fetch('/brightness?v=' + v);
}
function startEffect() {
  var colors=[...document.querySelectorAll('#palette input')].map(function(i){
    var h=i.value.slice(1);
    return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};
  });
  if(!colors.length) colors=[{r:255,g:0,b:0}];
  fetch('/effect',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:+document.getElementById('efxId').value,
      speed:+document.getElementById('efxSpeed').value,
      dotSize:+document.getElementById('efxDot').value,
      palette:colors})});
}
function addColor() {
  if(document.querySelectorAll('#palette input').length>=4) return;
  var inp=document.createElement('input'); inp.type='color'; inp.value='#ff0000';
  inp.style='margin:0;width:52px;height:44px;cursor:pointer;touch-action:manipulation';
  document.getElementById('palette').appendChild(inp);
}
function initPalette(rs,gs,bs,sz) {
  var p=document.getElementById('palette'); p.innerHTML='';
  for(var i=0;i<sz;i++){
    var inp=document.createElement('input'); inp.type='color';
    var r=rs[i]||0,g=gs[i]||0,b=bs[i]||0;
    inp.value='#'+('0'+r.toString(16)).slice(-2)+('0'+g.toString(16)).slice(-2)+('0'+b.toString(16)).slice(-2);
    inp.style='margin:0;width:52px;height:44px;cursor:pointer;touch-action:manipulation';
    p.appendChild(inp);
  }
}
function rssiBar(dbm) {
  if (!dbm) return '';
  var s = dbm>-55?5:dbm>-65?4:dbm>-72?3:dbm>-80?2:1;
  return ' &nbsp;|&nbsp; &#128246; '+'█'.repeat(s)+'░'.repeat(5-s)+' ('+dbm+' dBm)';
}
function refresh() {
  fetch('/status').then(r=>r.json()).then(d=>{
    document.getElementById('status').innerHTML =
      'Stav: <b>'+(d.playing?'přehrává':'zastaveno')+'</b>'
      +(d.file?' &nbsp;|&nbsp; '+d.file:'')
      +(d.commands?' &nbsp;|&nbsp; příkazy: '+d.commands:'')
      +(d.frames_expected?' &nbsp;|&nbsp; snímky: '+d.frames_rendered+'/'+d.frames_expected+(d.frames_expected>d.frames_rendered?' ⚠':''):'')
      +'<br>'+(d.ap_mode?'&#128246; AP: ':'IP: ')+'<a href="http://'+d.ip+'">'+d.ip+'</a>'
      +(d.hostname?' &nbsp;|&nbsp; '+d.hostname+'.local':'')
      +(d.ap_mode?' <span style="color:#e07b39">(Windows: použij IP odkaz)</span>':'')
      +' &nbsp;|&nbsp; &#128267; '+d.battery_pct+'% ('+d.battery_mv+' mV)'
      +(!d.ap_mode?rssiBar(d.rssi):'');
  });
  fetch('/peers').then(r=>r.json()).then(ps=>{
    document.getElementById('peers').innerHTML = ps.length
      ? '&#128279; ' + ps.map(p=>`<a href="http://${p.ip}">${p.hostname}</a> &#128267;${p.bat_pct}%${rssiBar(p.rssi)}${p.sync_channel?' &nbsp;ch'+p.sync_channel:''}`).join(' &nbsp;&middot;&nbsp; ')
      : '';
  }).catch(()=>{});
}
function upload() {
  const f = document.getElementById('file').files[0];
  if (!f) return alert('Vyber soubor');
  const p = document.getElementById('upProg');
  p.textContent = 'Nahrávám...';
  const fd = new FormData(); fd.append('file', f, f.name);
  fetch('/upload',{method:'POST',body:fd})
    .then(r=>r.text()).then(t=>{p.textContent=t;refresh();})
    .catch(()=>{p.textContent='Chyba nahrávání';});
}
function loadCfg() {
  fetch('/config').then(r=>r.json()).then(d=>{
    const f = document.getElementById('cfg');
    Object.keys(d).forEach(k=>{ if(f[k]) f[k].value=d[k]; });
    updClk(d.ledType);
    const bri = d.brightness || 0;
    document.getElementById('bri').value = bri;
    setBri(bri);
    document.getElementById('efxId').value    = d.effectId    || 1;
    document.getElementById('efxSpeed').value = d.effectSpeed || 100;
    document.getElementById('efxDot').value   = d.effectDotSize || 3;
    initPalette(d.paletteR||[255],d.paletteG||[0],d.paletteB||[0],d.paletteSize||1);
    if (d.batAutoOff !== undefined) f.batAutoOff.checked = !!d.batAutoOff;
  });
}
function saveCfg() {
  const f = document.getElementById('cfg');
  var pal=[...document.querySelectorAll('#palette input')].map(function(i){
    var h=i.value.slice(1);
    return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};
  });
  if(!pal.length) pal=[{r:255,g:0,b:0}];
  const d = {
    ledType: parseInt(f.ledType.value), numLeds: parseInt(f.numLeds.value),
    dataPin: parseInt(f.dataPin.value), clkPin:  parseInt(f.clkPin.value),
    pixFile: f.pixFile.value, ssid: f.ssid.value, password: f.password.value,
    hostname: f.hostname.value,
    syncChannel: parseInt(f.syncChannel.value),
    brightness:   parseInt(document.getElementById('bri').value),
    effectId:      parseInt(document.getElementById('efxId').value),
    effectSpeed:   parseInt(document.getElementById('efxSpeed').value),
    effectDotSize: parseInt(document.getElementById('efxDot').value),
    mALimit:  parseInt(f.mALimit.value)  || 0,
    batPin:              parseInt(f.batPin.value)              || 2,
    batMultiplier:       parseFloat(f.batMultiplier.value)     || 2.0,
    batCalibration:      parseFloat(f.batCalibration.value)    || 0.0,
    batMinMv:            parseInt(f.batMinMv.value)            || 3200,
    batMaxMv:            parseInt(f.batMaxMv.value)            || 4200,
    batIntervalMs:       parseInt(f.batIntervalMs.value)       || 30000,
    batAutoOff:          f.batAutoOff.checked,
    batAutoOffThreshold: parseInt(f.batAutoOffThreshold.value) || 10,
    paletteSize: pal.length,
    paletteR: pal.map(function(c){return c.r;}),
    paletteG: pal.map(function(c){return c.g;}),
    paletteB: pal.map(function(c){return c.b;})
  };
  fetch('/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})
    .then(r=>r.text()).then(t=>{document.getElementById('cfgMsg').textContent=t;});
}
function reboot() {
  fetch('/reboot',{method:'POST'});
  document.getElementById('cfgMsg').textContent='Rebootuji...';
}
function updateFw() {
  const f = document.getElementById('fw').files[0];
  if (!f) return alert('Vyber .bin soubor');
  const p = document.getElementById('fwProg');
  p.textContent = 'Nahrávám firmware...';
  const fd = new FormData(); fd.append('firmware', f, f.name);
  fetch('/update',{method:'POST',body:fd})
    .then(r=>r.text()).then(t=>{p.textContent=t;})
    .catch(()=>{p.textContent='Chyba nahrávání';});
}
setInterval(refresh, 2000);
refresh(); loadCfg();
</script>
</body></html>
