; PlatformIO Project Configuration File

[platformio]
default_envs = seeed_xiao_esp32s3

[common]
build_flags =
  -Wno-attributes
  -D CORE_DEBUG_LEVEL=0
  -D NDEBUG

build_unflags =

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[esp32s3]
platform = espressif32@5.3.0
platform_packages =
build_flags =
  -g
  -DESP32
  -DARDUINO_ARCH_ESP32
  -DARDUINO_ARCH_ESP32S3
  -DCONFIG_IDF_TARGET_ESP32S3=1
  -D CONFIG_ASYNC_TCP_USE_WDT=0
  -DARDUINO_USB_MSC_ON_BOOT=0
  -DARDUINO_DFU_ON_BOOT=0

[esp32c3]
platform = espressif32@5.3.0
platform_packages =
build_flags =
  -g
  -DESP32
  -DARDUINO_ARCH_ESP32
  -DARDUINO_ARCH_ESP32C3
  -DCONFIG_IDF_TARGET_ESP32C3=1
  -D CONFIG_ASYNC_TCP_USE_WDT=0
  -DARDUINO_USB_MODE=1

[env:seeed_xiao_esp32s3]
;; Seeed Studio XIAO ESP32-S3 with 8MB flash and OPI PSRAM.
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_8MB.csv
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.filesystem = littlefs
platform = ${esp32s3.platform}
platform_packages = ${esp32s3.platform_packages}
upload_speed = 921600
build_unflags = ${common.build_unflags}
build_flags =
  ${common.build_flags}
  ${esp32s3.build_flags}
  -D CONFIG_LITTLEFS_FOR_IDF_3_2
  -D WLED_WATCHDOG_TIMEOUT=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
monitor_filters = esp32_exception_decoder
lib_deps = bblanchon/ArduinoJson @ ^6.21
extra_scripts = pre:tools/embed_html.py

[env:esp32c3dev]
;; ESP32-C3 DevKitM-1 style boards with 4MB flash, OTA slots and LittleFS.
board = esp32-c3-devkitm-1
board_build.partitions = partitions_4MB_ota.csv
board_build.filesystem = littlefs
board_build.flash_mode = dio
platform = ${esp32c3.platform}
platform_packages = ${esp32c3.platform_packages}
upload_speed = 460800
build_unflags = ${common.build_unflags}
build_flags =
  ${common.build_flags}
  ${esp32c3.build_flags}
  -D CONFIG_LITTLEFS_FOR_IDF_3_2
  -D WLED_WATCHDOG_TIMEOUT=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_filters = esp32_exception_decoder
lib_deps = bblanchon/ArduinoJson @ ^6.21
extra_scripts = pre:tools/embed_html.py
