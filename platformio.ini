; PlatformIO Project Configuration File

[platformio]
default_envs = esp32s3dev_8MB_PSRAM_opi

[common]
build_flags =
  -Wno-attributes
  -D CORE_DEBUG_LEVEL=0
  -D NDEBUG

build_unflags =

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[esp32s3]
platform = espressif32@5.3.0
platform_packages =
build_flags =
  -g
  -DESP32
  -DARDUINO_ARCH_ESP32
  -DARDUINO_ARCH_ESP32S3
  -DCONFIG_IDF_TARGET_ESP32S3=1
  -D CONFIG_ASYNC_TCP_USE_WDT=0
  -DARDUINO_USB_MSC_ON_BOOT=0
  -DARDUINO_DFU_ON_BOOT=0

[env:esp32s3dev_8MB_PSRAM_opi]
;; ESP32-S3 with 8MB FLASH and >= 8MB PSRAM (memory_type: qio_opi)
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_8MB.csv
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.filesystem = littlefs
platform = ${esp32s3.platform}
platform_packages = ${esp32s3.platform_packages}
upload_speed = 921600
build_unflags = ${common.build_unflags}
build_flags =
  ${common.build_flags}
  ${esp32s3.build_flags}
  -D CONFIG_LITTLEFS_FOR_IDF_3_2
  -D WLED_WATCHDOG_TIMEOUT=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
monitor_filters = esp32_exception_decoder
lib_deps = bblanchon/ArduinoJson @ ^6.21
extra_scripts = pre:tools/embed_html.py
