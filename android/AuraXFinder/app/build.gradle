plugins {
    id "com.android.application"
}

android {
    namespace "com.aurax.finder"
    compileSdk 35

    signingConfigs {
        installTest {
            storeFile rootProject.file("../../.tools/android-build/aurax-install-test.jks")
            storePassword "auraxpass"
            keyAlias "aurax"
            keyPassword "auraxpass"
        }
    }

    defaultConfig {
        applicationId "com.aurax.finder"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            applicationIdSuffix ".install"
            versionNameSuffix "-install"
            signingConfig signingConfigs.installTest
            minifyEnabled false
            shrinkResources false
        }
    }
}
