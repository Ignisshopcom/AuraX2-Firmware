name: Android Finder

on:
  workflow_dispatch:
  push:
    paths:
      - "android/AuraXFinder/**"
      - ".github/workflows/android-finder.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/AuraXFinder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AuraXFinder-debug-apk
          path: android/AuraXFinder/app/build/outputs/apk/debug/app-debug.apk
